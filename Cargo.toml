[package]
name = "common-tools-api"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["."]

[workspace.dependencies]
tracing = "0.1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
serde_json = "1"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
provider-keycdn = ["dep-serde-with"]
provider-geoapify = ["dep-serde-with"]
preserve-query-order = ["serde_json/preserve_order"]
test-integration = []

dep-serde-with = ["dep:serde_with"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["gzip", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3.25", optional = true }
serde_json = { workspace = true }
thiserror = "2.0"
tokio = { workspace = true }
tracing = { workspace = true }
url = "2.5"

[dev-dependencies]
futures = "0.3"
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = { workspace = true, features = ["preserve_order"] }
