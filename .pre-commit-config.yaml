default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/crate-ci/typos
    rev: v1.46.1
    hooks:
      - id: typos

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/FeryET/pre-commit-rust
    rev: v1.2.1
    hooks:
      - id: fmt
      - id: cargo-check
      - id: clippy

  - repo: local
    hooks:
      - id: cargo-doc
        name: cargo doc (no deps, warnings as errors)
        language: system
        entry: env RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features
        pass_filenames: false
        types: [rust]
